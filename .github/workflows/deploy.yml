name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maduy-consult-TiXqJr/maduy-consult
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --filter @template/web

      - name: Build
        working-directory: maduy-consult-TiXqJr/maduy-consult/packages/web
        run: bun x vite build

      - name: Prepare for GitHub Pages
        working-directory: maduy-consult-TiXqJr/maduy-consult/packages/web/dist
        run: |
          # Each page gets its own index.html so direct links load,
          # and unknown paths fall back to the app.
          for page in alliance west-africa funding; do
            mkdir -p "$page" && cp index.html "$page/index.html"
          done
          cp index.html 404.html
          cp "$GITHUB_WORKSPACE/CNAME" CNAME
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: maduy-consult-TiXqJr/maduy-consult/packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
